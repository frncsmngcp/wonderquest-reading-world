/* Mobile/touch reliability: the bookshelf owns horizontal swipes while still
   allowing vertical browser gestures and pinch zoom. */
#shelf,.shelf-grid,.book-card{touch-action:pan-y pinch-zoom;-webkit-user-select:none;user-select:none}
#reader{touch-action:pan-y pinch-zoom}

/* Keep status content inside the baked cream plaque even on a tiny 16:9
   viewport. JS switches it to a compact two-line form when needed. */
.reader-status{
  left:87.12% !important; top:3.22% !important; width:9.8% !important; height:6.5% !important;
  padding:.05em .18em .10em !important; display:flex !important; flex-direction:column !important;
  align-items:center !important; justify-content:center !important; gap:0 !important;
  overflow:hidden !important; white-space:normal !important; text-align:center !important;
  line-height:1.02 !important; letter-spacing:-.02em !important; font-size:clamp(6px,.68vw,13px) !important;
}
.reader-status .status-line{display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:clip}

/* Compact controls leave more vertical room for story copy on phones. */
.stage.compact-ui .right-page{padding-top:1.4%;padding-bottom:1.3%}
.stage.compact-ui .story-copy{padding-top:0;padding-bottom:.08em}
.stage.compact-ui .story-title{line-height:1.12;padding:0 0 .08em;margin-bottom:.7%}
.stage.compact-ui .story-text{line-height:1.18;padding:.02em 0 .12em;text-wrap:wrap}
.stage.compact-ui .reading-focus-bar{gap:3px;margin-top:.35%;font-size:clamp(7px,.64vw,11px)}
.stage.compact-ui .focus-mini{border-width:1px;padding:2px 5px;box-shadow:none}
.stage.compact-ui .scene-art .scene-tag{padding-top:.9%;padding-bottom:1.05%;font-size:clamp(7px,.75vw,14px)}
.stage.compact-ui .reader-nav{border-width:2px}

/* Very small device safety. The text fitter supplies the actual font size; the
   CSS here removes hard minimums that used to force clipping. */
@media (max-height:560px),(max-width:900px){
  .story-title{font-size:clamp(8px,1.05vw,18px)}
  .story-text{font-size:clamp(8px,2.1vw,30px)}
  .q-text{font-size:clamp(9px,1.8vw,26px)}
  .choice{font-size:clamp(8px,1.15vw,18px)}
  .reader-status{font-size:clamp(6px,.62vw,10px) !important}
}
/* The story body must keep its natural content height while fitting.  Without
   this, flexbox can shrink the text box and hide its last lines before the JS
   fitter notices. This is especially visible in portrait phone letterboxing. */
.story-title{flex:0 0 auto}
.story-text{flex:0 0 auto;min-height:auto;max-height:none}
.stage.compact-ui .story-copy{justify-content:center}
</style>

<div id="app"><main class="stage" id="stage">

    <button class="hotspot home-badge js-badges" aria-label="Badges"></button>

    <button class="hotspot reader-full js-full" aria-label="Fullscreen"></button>

    <button class="hotspot reader-badge js-badges" aria-label="Badges"></button>

  <div id="settingsModal" class="modal"><div class="panel">

    <div class="setting-row"><span>Automatic Story Voice</span><button id="autoVoice" class="toggle">OFF</button></div>
    <div class="setting-row"><label for="voiceSelectEn">English Voice</label><select id="voiceSelectEn" aria-label="English story voice"></select></div>
    <div class="setting-row"><label for="voiceSelectFil">Filipino Voice</label><select id="voiceSelectFil" aria-label="Filipino story voice"></select></div>

    <div class="setting-row"><span>Syllabication / Reading Focus</span><button id="focusToggle" class="toggle on">ON</button></div>
    <div class="setting-row"><label for="focusUnit">Emphasis</label><select id="focusUnit"><option value="word">By word</option><option value="syllable" selected>By syllable</option></select></div>
    <div class="setting-row"><span>Reset reading progress</span><button id="resetProgress" class="reset">Reset All Progress</button></div>
  </div></div>

  <div id="badgesModal" class="modal"><div class="panel">

"questions": [["What does Leo plant?", ["A rock", "A seed", "A toy"], 1], ["What does Leo give the seed?", ["Juice", "Milk", "Water"], 2], ["What shines on the plant?", ["The sun", "A lamp", "The moon"], 0], ["What comes out of the soil first?", ["A fruit", "A sprout", "A tree"], 1], ["What grows at the end?", ["A flower", "A chair", "A shoe"], 0]], "badge": "Little Gardener Badge"}, {"n": 4, "title": "Sam and the Rain", "level": "Easy", "theme": "Weather / Feelings", "fantasy": false, "scenes": ["Sam wants to play outside.\nHe gets his blue ball.", "Drip! Drop!\nRain begins to fall.", "“Oh no,” says Sam.\n“I cannot play outside.”", "Dad brings paper and crayons.\nSam draws a big rainbow.", "Sam smiles.\nA rainy day can be fun, too!"], "questions": [["What does Sam want to do?", ["Sleep", "Play outside", "Cook"], 1], ["What happens outside?", ["It snows", "It rains", "It gets dark"], 1], ["How does Sam feel at first?", ["Excited", "Sad", "Hungry"], 1], ["What does Dad bring?", ["Shoes", "Food", "Paper and crayons"], 2], ["What does Sam draw?", ["A bus", "A rainbow", "A fish"], 1]], "badge": "Rainy Day Reader Badge"}, {"n": 5, "title": "A Home for Pip", "level": "Easy", "theme": "Animals / Homes", "fantasy": false, "scenes": ["Pip is a little bird.\nHe needs a home.", "Pip looks inside a box.\n“No, this is not my home.”", "Pip looks under a bench.\n“No, not here.”", "Pip sees a tree.\nThere is a little nest!", "Pip sits in the nest.\n“This is my home!” he chirps."], "questions": [["What animal is Pip?", ["A cat", "A bird", "A dog"], 1], ["What does Pip need?", ["A ball", "Food", "A home"], 2], ["Where does Pip look first?", ["Inside a box", "In a pond", "On a bus"], 0], ["Where is Pip’s home?", ["Under a chair", "In a tree", "In a shoe"], 1], ["What is Pip’s home called?", ["A cage", "A cave", "A nest"], 2]], "badge": "Happy Nest Badge"}, {"n": 6, "title": "Lily’s New Friend", "level": "Easy", "theme": "Friendship / Kindness", "fantasy": false, "scenes": ["A new girl comes to class.\nHer name is Emma.", "Emma sits alone.\nShe looks shy.", "Lily walks to Emma.\n“Would you like to play?”", "They build a tall block tower.\nCrash! They both laugh.", "Emma smiles.\nLily has a new friend."], "questions": [["Who is new in class?", ["Lily", "Emma", "Mia"], 1], ["How does Emma feel at first?", ["Angry", "Shy", "Silly"], 1], ["Who talks to Emma?", ["Lily", "Ben", "Sam"], 0], ["What do they build?", ["A house", "A block tower", "A boat"], 1], ["What happens at the end?", ["Emma goes home.", "Lily cries.", "They become friends."], 2]], "badge": "Kind Friend Badge"}, {"n": 7, "title": "The Moon’s Little Ladder", "level": "Easy", "theme": "Fantasy / Moon / Imagination", "fantasy": true, "scenes": ["Noah looks at the moon.\n“It is so bright!” he says.", "A silver ladder appears.\nIt shines outside his window.", "Noah climbs up, up, up.\nHe reaches a soft white cloud.", "The moon smiles at Noah.\n“Hello, little visitor!”", "Noah wakes in his bed.\nWas it a dream?"], "questions": [["What does Noah see in the sky?", ["A kite", "The moon", "A plane"], 1], ["What appears outside his window?", ["A bridge", "A silver ladder", "A boat"], 1], ["Where does Noah climb?", ["Down", "Up", "Under the bed"], 1], ["Who talks to Noah?", ["The sun", "A bird", "The moon"], 2], ["Where is Noah at the end?", ["On the moon", "In his bed", "At school"], 1]], "badge": "Moon Climber Badge"}, {"n": 8, "title": "The Cloud Pillow", "level": "Easy", "theme": "Fantasy / Dreams", "fantasy": true, "scenes": ["Ella cannot sleep.\nShe looks out her window.", "A fluffy cloud floats down.\n“Come with me,” it whispers.", "Ella sits on the cloud.\nIt feels soft like a pillow.", "They float over quiet houses.\nStars twinkle around them.", "The cloud brings Ella home.\nSoon, she is fast asleep."], "questions": [["What can Ella not do?", ["Eat", "Read", "Sleep"], 2], ["What comes to Ella?", ["A bird", "A cloud", "A car"], 1], ["How does the cloud feel?", ["Hard", "Hot", "Soft"], 2], sing Lunch Box", "level": "Average", "theme": "School / Mystery", "fantasy": false, "scenes": ["It is lunchtime.\nElla opens her school bag.\n“My lunch box is gone!”", "Ella looks under her desk.\nShe looks beside her chair.\nIt is not there.", "“Where did you go this morning?” asks Mia.\nElla stops and thinks.", "Ella remembers the reading corner.\nShe had read a book there before class.", "They walk to the reading corner.\nThere is the lunch box on the shelf!", "“I found it!” says Ella.\n“Thank you for helping me, Mia.”"], "questions": [["What is missing?", ["A pencil", "A lunch box", "A shoe"], 1], ["Who helps Ella?", ["Leo", "Ben", "Mia"], 2], ["Where does Ella first look?", ["In the playground", "Under her desk", "In the garden"], 1], ["Where is the lunch box found?", ["In the bathroom", "In the reading corner", "Outside the gate"], 1], ["What helps Ella solve the problem?", ["She runs home.", "She remembers where she went.", "She buys another lunch box."], 1]], "badge": "Little Detective Badge"}, {"n": 12, "title": "Leo and the Tiny Garden", "level": "Average", "theme": "Environment / Gardening", "fantasy": false, "scenes": ["There is an empty patch beside Leo’s house.\n“It needs something,” Leo says.", "Leo loosens the soil.\nHe plants tomato and bean seeds.", "Every morning, Leo waters the garden.\nHe also pulls out tiny weeds.", "One morning, green leaves appear.\nLeo calls Mom to look.", "Weeks pass.\nTomatoes and beans begin to grow.", "Leo picks the vegetables with Mom.\nThe empty patch is now a tiny garden."], "questions": [["What is beside Leo’s house?", ["A pond", "An empty patch", "A playground"], 1], ["What does Leo plant?", ["Rice and corn", "Flowers only", "Tomatoes and beans"], 2], ["What does Leo do every morning?", ["Sleeps outside", "Waters the garden", "Picks all the leaves"], 1], ["Why do the plants grow?", ["Leo hides them.", "Leo takes care of them.", "Leo never waters them."], 1], ["What happens to the empty patch?", ["It becomes a parking lot.", "It becomes a garden.", "It disappears."], 1]], "badge": "Garden Keeper Badge"}, {"n": 13, "title": "The Helpful Ant", "level": "Average", "theme": "Fable / Helping Others", "fantasy": false, "scenes": ["Ani is a very small ant.\nSome animals think she is too small to help.", "One day, Rabbit drops his bag of seeds.\nThe seeds scatter everywhere.", "“I can help!” says Ani.\nShe calls her ant friends.", "The ants carry the seeds one by one.\nSoon, the path is clean.", "Later, Bird’s ribbon falls into a tiny crack.\nOnly Ani can crawl inside.", "Ani brings the ribbon back.\nThe animals cheer.\n“Small helpers can do big things!”"], "questions": [["What animal is Ani?", ["A rabbit", "An ant", "A bird"], 1], ["What does Rabbit drop?", ["Apples", "Toys", "Seeds"], 2], ["Who helps Ani carry the seeds?", ["Her ant friends", "Fish", "Ducks"], 0], ["Why can Ani get the ribbon?", ["She can fly.", "She is small enough to enter the crack.", "She has a ladder."], 1], ["What is the lesson?", ["Only big animals can help.", "Never help anyone.", "Everyone can be helpful."], 2]], "badge": "Big Helper Badge"}, {"n": 14, "title": "Nina’s Paper Boat", "level": "Average", "theme": "Adventure / Imagination", "fantasy": false, "scenes": ["Nina folds a blue sheet of paper.\nShe makes a little boat.", "After the rain, water runs beside the path.\nNina puts her boat in the water.", "The boat floats past flowers and stones.\nNina follows it slowly.", "The boat gets stuck behind a twig.\n“Oh no!” says Nina.", "Nina gently moves the twig.\nThe little boat sails again.", "The boat reaches a quiet puddle.\nNina picks it up.\n“What a big trip for a little boat!”"], "questions": [["What does Nina make?", ["A kite", "A paper boat", "A paper hat"], 1], ["When does Nina put it in the water?", ["Before breakfast", "After the rain", "At night"], 1], ["What stops the boat?", ["A fish", "A twig", "A shoe"], 1], ["How does Nina help the boat?", ["She throws it away.", "She moves the twig.", "She takes all the water away."], 1], ["Where does the boat end its trip?", ["In a tree", "In a quiet puddle", "On a roof"], 1]], "badge": "Paper Boat Explorer Badge"}, {"n": 15, "title": "The Day the Lights Went Out", "level": "Average", "theme": "Family / Problem Solving", "fantasy": false, "scenes": ["Rain falls outside.\nSuddenly, all the lights go out.", "“It is so dark!” says Jay.\nDad turns on a safe battery lantern.", "The television does not work.\nJay starts to feel bored.", "Mom brings a book.\n“Let us tell stories instead,” she says.", "The family tells funny stories.\nThey make shadow animals with their hands.", "The lights come back on.\nJay smiles.\n“That was actually fun!”"], "questions": [["What happens to the lights?", ["They become brighter.", "They go out.", "They turn blue."], 1], ["What does Dad use?", ["A candle in the bedroom", "A battery lantern", "A television"], 1], ["How does Jay feel at first?", ["Excited", "Bored", "Hungry"], 1], ["What does the family do together?", ["Goes swimming", "Tells stories", "Drives away"], 1], ["What does Jay learn?", ["Fun is impossible without electricity.", "Families can find other ways to have fun.", "Rain is always bad."], 1]], "badge": "Family Story Night Badge"}, {"n": 16, "title": "The Rainbow Kite", "level": "Average", "theme": "Outdoor Play / Wind", "fantasy": false, "scenes": ["Kai and Rose make a rainbow kite.\nThey cannot wait to fly it.", "Kai runs across the field.\nThe kite falls to the ground.", "He tries again.\nIt still will not fly.", "Rose feels the air on her face.\n“Wait! There is almost no wind.”", "Soon, the trees begin to sway.\n“Now!” calls Rose.", "Kai runs again.\nThe rainbow kite rises high into the sky."], "questions": [["What do Kai and Rose make?", ["A boat", "A kite", "A flag"], 1], ["What happens at first?", ["The kite flies high.", "The kite falls.", "The kite disappears."], 1], ["What is missing?", ["Rain", "Snow", "Wind"], 2], ["What shows that the wind has come?", ["The grass t hat begins to glow?", ["A yellow window", "A purple door", "Zoe’s chair"], 1], ["Where does Zoe go?", ["The zoo", "Inside the Crayon Castle", "The moon"], 1], ["What is missing?", ["The red crayon", "The blue crayon", "The green crayon"], 2], ["What happens when the green crayon is found?", ["The castle disappears.", "Green returns to the garden.", "Everything turns black."], 1]], "badge": "Crayon Kingdom Badge"}, {"n": 19, "title": "The Little Dragon Who Could Not Roar", "level": "Average", "theme": "Fantasy / Courage", "fantasy": true, "scenes": ["Dino is a little dragon.\nHis friends can make big, loud roars.", "Dino opens his mouth.\n“Pip!” is the only sound that comes out.", "Dino feels embarrassed.\n“I will never roar,” he whispers.", "One day, a baby bird falls near the river.\nIt is scared to cross a log.", "Dino calls, “You can do it!”\nHis voice grows louder and stronger.", "“ROAR!”\nDino finally roars.\nBut he is happiest because he helped the little bird."], "questions": [["What is Dino?", ["A dinosaur", "A bird", "A dragon"], 2], ["What sound does Dino make at first?", ["Roar", "Pip", "Moo"], 1], ["How does Dino feel?", ["Proud", "Embarrassed", "Sleepy"], 1], ["Who needs help?", ["A rabbit", "A baby bird", "A fish"], 1], ["What helps Dino find his strong voice?", ["Helping someone else", "Eating a cake", "Going to sleep"], 0]], "badge": "Brave Dragon Badge"}, {"n": 20, "title": "The Window to the Wind", "level": "Average", "theme": "Fantasy / Magical Adventure", "fantasy": true, "scenes": ["Luca finds a tiny blue window in Grandma’s attic.\nIt is too small for a real house.", "He opens it.\nWhoosh! A cool wind spins around the room.", "A little Wind Spirit appears.\n“I have lost my silver feather,” it says.", "Luca follows dancing leaves into the garden.\nThey point toward the old tree.", "The silver feather is caught on a branch.\nLuca carefully reaches it with a long stick.", "The Wind Spirit gets its feather back.\nIt blows one gentle breeze and disa , "Pusa", "Rocket"], 2], ["Ano ang natutuhan ni Riko?", ["Kailangan laging siya ang nagsasalita.", "Mahalaga ang pakikinig at pagbabahagi.", "Hindi kailangan ang kaibigan."], 1]], "badge": "Robot na Kaibigan Badge"}, {"n": 27, "title": "Gabi ng mga Alitaptap", "level": "Mahirap", "theme": "Kalikasan / Pagtuklas", "fantasy": false, "scenes": ["Pagkatapos kumain, lumabas sina Mara at Kuya Ben kasama si Tatay.\nTahimik ang gabi.", "May isang maliit na ilaw na kumislap sa damuhan.\nMay sumunod pang isa.", "“Mga bituin sa lupa!” bulong ni Mara.\n“Mga alitaptap iyan,” sabi ni Tatay.", "Parami nang parami ang kumikislap na ilaw.\nParang sumasayaw ang buong damuhan.", "Gustong hulihin ni Ben ang isa.\n“Panoorin na lang natin sila,” sabi ni Tatay.", "May isang alitaptap na dumapo sandali sa kamay ni Mara.\nPagkatapos ay lumipad muli ito.", "Habang pauwi, lumingon si Mara.\n“Parang hardin ng maliliit na bituin.”"], "questions": [["Kailan lumabas ang pamilya?", ["Tanghali", "Gabi", "Umaga"], 1], ["Ano ang kumikislap sa damuhan?", ["Barya", "Alitaptap", "Laruan"], 1], ["Ano ang tawag ni Mara sa mga ito noong una?", ["Mga bulaklak", "Mga bituin sa lupa", "Mga mata"], 1], ["Bakit hindi nila hinuli ang mga alitaptap?", ["Para hindi masira ang kanilang laruan.", "Para mapanood sila nang hindi sinasaktan.", "Dahil umuulan."], 1], ["Ano ang inihambing ni Mara sa damuhan?", ["Silid-aralan", "Hardin ng maliliit na bituin", "Palengke"], 1]], "badge": "Kaibigan ng Alitaptap"}, {"n": 28, "title": "Ang Bangkang Papel ni Lira", "level": "Mahirap", "theme": "Pakikipagsapalaran / Tubig", "fantasy": false, "scenes": ["Gumawa si Lira ng pulang bangkang papel pagkatapos ng ulan.", "Inilagay niya ito sa maliit na agos ng tubig.\nDahan-dahang umandar ang bangka.", "Dumaan ito sa ilalim ng tulay na kahoy.\nSinundan ito ni Lira at ng kapatid niyang si Niko.", "Umikot ang bangka sa mga bato at dahon.\nBumilis ang agos.", "Sa unahan ay may mas malalim na kanal.\n“Kailangan natin itong kunin!” sabi ni // Voice — independent English and Filipino selectors.
let voices=[];
function voiceKey(v){return v.voiceURI||v.name||''}
function voiceMatches(v,lang){
 const code=(v.lang||'').toLowerCase(),name=(v.name||'').toLowerCase();
 if(lang==='fil')return /^(fil|tl)(-|$)/.test(code)||/filipino|tagalog|philippine/.test(name);
 return /^en(-|$)/.test(code)||/english/.test(name);
}
function preferredVoice(lang,candidates){
 if(!candidates.length)return null;
 if(lang==='fil')return candidates.find(v=>/^(fil|tl)-ph/i.test(v.lang||''))||candidates.find(v=>/filipino|tagalog|philippine/i.test(v.name||''))||candidates[0];
 return candidates.find(v=>/^en-us/i.test(v.lang||''))||candidates.find(v=>/^en-gb/i.test(v.lang||''))||candidates[0];
}
function fillVoiceSelect(sel,lang,saved){
 if(!sel)return '';
 sel.innerHTML='';
 let candidates=voices.filter(v=>voiceMatches(v,lang));
 const hasLanguageVoice=candidates.length>0;
 if(!candidates.length)candidates=voices.slice();
 if(!candidates.length){const o=document.createElement('option');o.value='';o.textContent=lang==='fil'?'System Filipino voice':'System English voice';sel.appendChild(o);return ''}
 candidates.forEach(v=>{const o=document.createElement('option');o.value=voiceKey(v);o.textContent=`${v.name} (${v.lang||'system'})${!hasLanguageVoice?' — fallback':''}`;sel.appendChild(o)});
 const chosen=candidates.find(v=>voiceKey(v)===saved)||preferredVoice(lang,candidates);
 sel.value=chosen?voiceKey(chosen):'';
 return sel.value;
}
function loadVoices(){
 voices=speechSynthesis.getVoices();
 /* Migrate the old single selector to English once, then maintain two independent choices. */
 if(!settings.voiceNameEn&&settings.voiceIndex&&voices[settings.voiceIndex])settings.voiceNameEn=voiceKey(voices[settings.voiceIndex]);
 settings.voiceNameEn=fillVoiceSelect($('#voiceSelectEn'),'en',settings.voiceNameEn);
 settings.voiceNameFil=fillVoiceSelect($('#voiceSelectFil'),'fil',settings.voiceNameFil);
 saveSettings();
}
speechSynthesis.onvoiceschanged=loadVoices;loadVoices();
$('#voiceSelectEn').onchange=e=>{settings.voiceNameEn=e.target.value;saveSettings()};
$('#voiceSelectFil').onchange=e=>{settings.voiceNameFil=e.target.value;saveSettings()};
function selectedVoice(lang){const key=lang==='fil'?settings.voiceNameFil:settings.voiceNameEn;return voices.find(v=>voiceKey(v)===key)||preferredVoice(lang,voices.filter(v=>voiceMatches(v,lang)))||null}
function readCurrent(){if(!state.book)return;speechSynthesis.cancel();let text='';if(state.mode==='story')text=state.book.scenes[state.scene];else{const q=state.book.questions[state.qIndex];text=q[0]+'. A. '+q[1][0]+'. B. '+q[1][1]+'. C. '+q[1][2]}const u=new SpeechSynthesisUtterance(text);u.rate=settings.speechRate;u.lang=state.lang==='fil'?'fil-PH':'en-US';const v=selectedVoice(state.lang);if(v)u.voice=v;speechSynthesis.speak(u);}

// Procedural serene garden BGM — offline, no external audio file.
let audioCtx=null,master=null,musicTimer=null,birdTimer=null,windSrc=null;
function startAudioIfNeeded(){
 if(!settings.bgm&& !audioCtx)return;
 if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();master=audioCtx.createGain();master.connect(audioCtx.destination);setupWind();startGardenLoop()}
 if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
 setMusicState();
}
function setMusicState(){if(!master||!audioCtx)return;master.gain.setTargetAtTime(settings.bgm?settings.bgmVol:0,audioCtx.currentTime,.15)}
function setupWind(){const len=audioCtx.sampleRate*2,b=audioCtx.createBuffer(1,len,audioCtx.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1);windSrc=audioCtx.createBufferSource();windSrc.buffer=b;windSrc.loop=true;const lp=audioCtx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=480;const g=audioCtx.createGain();g.gain.value=.06;windSrc.connect(lp).connect(g).connect(master);windSrc.start()}
const gardenNotes=[261.63,329.63,392,523.25,392,329.63,293.66,392];let noteIdx=0;function startGardenLoop(){musicTimer=setInterval(()=>{if(!audioCtx||audioCtx.state!=='running'||!settings.bgm)return;const now=audioCtx.currentTime;const osc=audioCtx.createOscillator(),g=audioCtx.createGain();osc.type='sine';osc.frequency.value=gardenNotes[noteIdx++%gardenNotes.length]/2;g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(.055,now+.12);g.gain.exponentialRampToValueAtTime(.001,now+1.35);osc.connect(g).connect(master);osc.start(now);osc.stop(now+1.45)},1450);birdTimer=setInterval(()=>birdChirp(),4300)}
function birdChirp(){if(!audioCtx||audioCtx.state!=='running'||!settings.bgm)return;const now=audioCtx.currentTime;for(let j=0;j<2;j++){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(1350+Math.random()*400,now+j*.13);o.frequency.exponentialRampToValueAtTime(2100+Math.random()*500,now+j*.13+.1);g.gain.setValueAtTime(.0001,now+j*.13);g.gain.exponentialRampToValueAtTime(.035,now+j*.13+.025);g.gain.exponentialRampToValueAtTime(.0001,now+j*.13+.12);o.connect(g).connect(master);o.start(now+j*.13);o.stop(now+j*.13+.14)}}
function clickChime(){startAudioIfNeeded();if(!audioCtx)return;const n=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=620;o.type='sine';g.gain.setValueAtTime(.035,n);g.gain.exponentialRampToValueAtTime(.001,n+.13);o.connect(g).connect(audioCtx.destination);o.start(n);o.stop(n+.15)}
function successTone(){startAudioIfNeeded();[660,880].forEach((f,i)=>{const n=audioCtx.currentTime+i*.09,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=f;g.gain.setValueAtTime(.05,n);g.gain.exponentialRampToValueAtTime(.001,n+.2);o.connect(g).connect(audioCtx.destination);o.start(n);o.stop(n+.22)})}
function errorTone(){startAudioIfNeeded();const n=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=210;o.type='triangle';g.gain.setValueAtTime(.04,n);g.gain.exponentialRampToValueAtTime(.001,n+.22);o.connect(g).connect(audioCtx.destination);o.start(n);o.stop(n+.24)}
function celebrateTone(){startAudioIfNeeded();[523,659,784,1047].forEach((f,i)=>{setTimeout(()=>successTone(),i*95)})}
function attemptAutoBGM(){if(settings.bgm){try{startAudioIfNeeded()}catch(e){}}}
attemptAutoBGM();
document.addEventListener('pointerdown',attemptAutoBGM,{once:true,capture:true});
document.addEventListener('keydown',attemptAutoBGM,{once:true,capture:true});
document.addEventListener('touchstart',attemptAutoBGM,{once:true,capture:true,passive:true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&settings.bgm)attemptAutoBGM()});

// Touch, swipe, and multi-touch support for the reader.
const readerPointers=new Set();let readerSwipe=null;
$('#reader').addEventListener('pointerdown',e=>{
 if(e.pointerType==='mouse'&&e.button!==0)return;if(document.querySelector('.modal.open'))return;
 readerPointers.add(e.pointerId);if(readerPointers.size>1){readerSwipe=null;return;}
 if(e.target.closest('button,input,select')){readerSwipe=null;return;}
 readerSwipe={id:e.pointerId,x:e.clientX,y:e.clientY,t:performance.now(),fromFocus:!!e.target.closest('.focus-token')};
});
$('#reader').addEventListener('pointermove',e=>{if(!readerSwipe||readerSwipe.id!==e.pointerId||readerPointers.size>1)return;const dx=e.clientX-readerSwipe.x,dy=e.clientY-readerSwipe.y;if(!readerSwipe.fromFocus&&Math.abs(dx)>24&&Math.abs(dx)>Math.abs(dy)*1.25&&e.cancelable)e.preventDefault();});
$('#reader').addEventListener('pointerup',e=>{readerPointers.delete(e.pointerId);if(!readerSwipe||readerSwipe.id!==e.pointerId){if(!readerPointers.size)readerSwipe=null;return;}const g=readerSwipe;readerSwipe=null;const dx=e.clientX-g.x,dy=e.clientY-g.y,dt=performance.now()-g.t,threshold=g.fromFocus?110:72;if(dt<1200&&Math.abs(dx)>=threshold&&Math.abs(dx)>Math.abs(dy)*1.3){if(dx<0)nextPage();else prevPage();}});
$('#reader').addEventListener('pointercancel',e=>{readerPointers.delete(e.pointerId);readerSwipe=null});

// Native bookshelf swipe that works even when the gesture starts on a book.
// A completed drag suppresses the synthetic click so a book is not opened by accident.
let shelfSwipe=null,suppressShelfClickUntil=0;
const shelfEl=$('#shelf');
shelfEl.addEventListener('pointerdown',e=>{
 if(state.screen!=='shelf'||(e.pointerType==='mouse'&&e.button!==0)||e.isPrimary===false)return;
 if(e.target.closest('.shelf-home,.shelf-full,.shelf-settings,.badge-float,#teacher-francis-suite-home'))return;
 // Do not capture the pointer on a normal press. Capturing on pointerdown can
 // retarget the eventual desktop click from the book button to the shelf,
 // making cover clicks appear dead in Chrome/Safari/Edge. Capture only after
 // a real horizontal drag has started.
 shelfSwipe={id:e.pointerId,x:e.clientX,y:e.clientY,t:performance.now(),drag:false,captured:false};
});
shelfEl.addEventListener('pointermove',e=>{
 if(!shelfSwipe||shelfSwipe.id!==e.pointerId)return;const dx=e.clientX-shelfSwipe.x,dy=e.clientY-shelfSwipe.y;
 if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.15){
  if(!shelfSwipe.drag){
   shelfSwipe.drag=true;
   try{shelfEl.setPointerCapture(e.pointerId);shelfSwipe.captured=true}catch(_){ }
  }
  if(e.cancelable)e.preventDefault();
 }
},{passive:false});
shelfEl.addEventListener('pointerup',e=>{
 if(!shelfSwipe||shelfSwipe.id!==e.pointerId)return;const g=shelfSwipe;shelfSwipe=null;const dx=e.clientX-g.x,dy=e.clientY-g.y,dt=performance.now()-g.t;
 if(g.captured){try{shelfEl.releasePointerCapture(e.pointerId)}catch(_){ }}
 if(g.drag&&dt<1400&&Math.abs(dx)>=42&&Math.abs(dx)>Math.abs(dy)*1.15){suppressShelfClickUntil=performance.now()+500;state.shelfPage+=dx<0?1:-1;renderShelf();clickChime();if(e.cancelable)e.preventDefault();}
},{passive:false});
shelfEl.addEventListener('pointercancel',e=>{if(shelfSwipe?.captured){try{shelfEl.releasePointerCapture(e.pointerId)}catch(_){ }}shelfSwipe=null});
shelfEl.addEventListener('click',e=>{if(performance.now()<suppressShelfClickUntil&&e.target.closest('.book-card')){e.preventDefault();e.stopImmediatePropagation();}},true);

// Refit text after any real stage size change (browser chrome, rotation, PWA mode).
if('ResizeObserver'in window){new ResizeObserver(()=>{updateCompactUI();fitReaderStatus();if(state.screen==='reader'){if(state.mode==='story')requestAnimationFrame(fitStoryText);else requestAnimationFrame(fitQuestionText)}}).observe($('#stage'));}
let fitTimer;window.addEventListener('resize',()=>{clearTimeout(fitTimer);fitTimer=setTimeout(()=>{if(state.screen==='reader'){if(state.mode==='story')fitStoryText();else fitQuestionText()}},80)});window.addEventListener('orientationchange',()=>setTimeout(()=>{if(state.screen==='reader'){if(state.mode==='story')fitStoryText();else fitQuestionText()}},180));
document.addEventListener('keydown',e=>{if(e.key==='f'||e.key==='F')toggleFullscreen();if(e.key==='Escape')$$('.modal.open').forEach(m=>m.classList.remove('open'));if(state.screen==='shelf'){if(e.key==='ArrowLeft'){state.shelfPage--;renderShelf()}if(e.key==='ArrowRight'){state.shelfPage++;renderShelf()}}else if(state.screen==='reader'){if(e.key==='ArrowLeft')prevPage();if(e.key==='ArrowRight')nextPage();if(e.key==='Enter')readCurrent()}});

window.addEventListener('resize',()=>requestAnimationFrame(fitReaderStatus));window.addEventListener('tfviewportchange',()=>requestAnimationFrame(()=>{fitReaderStatus();if(state.screen==='reader'){if(state.mode==='story')fitStoryText();else fitQuestionText()}}));
if(document.fonts?.ready)document.fonts.ready.then(()=>{if(state.screen==='reader'){if(state.mode==='story')refitStoryAfterFonts();else fitQuestionText()}});
</script>

<script id="teacher-francis-suite-bridge-script">
(() => {
  const homeBtn = document.getElementById("teacher-francis-suite-home");
  if (!homeBtn) return;

  const POSITION_KEY = "teacher-francis-suite-home-position-v1";
  const EDGE_GAP = 6;
  const DRAG_THRESHOLD = 6;
  let activePointer = null;
  let startX = 0, startY = 0, startLeft = 0, startTop = 0;
  let dragging = false;
  let suppressClickUntil = 0;

  const goHome = () => {
    try { speechSynthesis?.cancel?.(); } catch {}
    try {
      if (window.parent && window.parent !== window) {
        try { if (typeof window.parent.showHome === "function") { window.parent.showHome(); return; } } catch {}
        parent.postMessage({ type: "teacher-francis-suite-home" }, "*");
      } else {
        location.href = "../index.html";
      }
    } catch {
      location.href = "../index.html";
    }
  };

  const viewportBox = () => {
    const vv = window.visualViewport;
    const width = Math.max(1, vv?.width || document.documentElement.clientWidth || innerWidth || 1);
    const height = Math.max(1, vv?.height || document.documentElement.clientHeight || innerHeight || 1);
    const left = vv?.offsetLeft || 0;
    const top = vv?.offsetTop || 0;
    return { width, height, left, top };
  };

  const clamp = (value, min, max) => Math.min(Math.max(value, min), Math.max(min, max));

  const placeAt = (left, top) => {
    const vp = viewportBox();
    const rect = homeBtn.getBoundingClientRect();
    const minLeft = vp.left + EDGE_GAP;
    const minTop = vp.top + EDGE_GAP;
    const maxLeft = vp.left + vp.width - rect.width - EDGE_GAP;
    const maxTop = vp.top + vp.height - rect.height - EDGE_GAP;
    const x = clamp(left, minLeft, maxLeft);
    const y = clamp(top, minTop, maxTop);
    homeBtn.style.setProperty("left", `${x}px`, "important");
    homeBtn.style.setProperty("top", `${y}px`, "important");
    homeBtn.style.setProperty("right", "auto", "important");
    homeBtn.style.setProperty("bottom", "auto", "important");
    return { x, y, vp, rect: homeBtn.getBoundingClientRect() };
  };

  const savePosition = () => {
    try {
      const vp = viewportBox();
      const rect = homeBtn.getBoundingClientRect();
      const usableW = Math.max(1, vp.width - rect.width - EDGE_GAP * 2);
      const usableH = Math.max(1, vp.height - rect.height - EDGE_GAP * 2);
      const x = clamp((rect.left - vp.left - EDGE_GAP) / usableW, 0, 1);
      const y = clamp((rect.top - vp.top - EDGE_GAP) / usableH, 0, 1);
      localStorage.setItem(POSITION_KEY, JSON.stringify({ x, y }));
    } catch {}
  };

  const restorePosition = () => {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(POSITION_KEY) || "null"); } catch {}
    if (!saved || !Number.isFinite(saved.x) || !Number.isFinite(saved.y)) return;
    requestAnimationFrame(() => {
      const vp = viewportBox();
      const rect = homeBtn.getBoundingClientRect();
      const usableW = Math.max(0, vp.width - rect.width - EDGE_GAP * 2);
      const usableH = Math.max(0, vp.height - rect.height - EDGE_GAP * 2);
      placeAt(
        vp.left + EDGE_GAP + clamp(saved.x, 0, 1) * usableW,
        vp.top + EDGE_GAP + clamp(saved.y, 0, 1) * usableH
      );
    });
  };

  const endDrag = (event, cancelled = false) => {
    if (activePointer === null || event.pointerId !== activePointer) return;
    const wasDragging = dragging;
    if (wasDragging) {
      event.preventDefault();
      event.stopImmediatePropagation();
      savePosition();
      suppressClickUntil = performance.now() + 700;
    }
    try { homeBtn.releasePointerCapture(activePointer); } catch {}
    activePointer = null;
    dragging = false;
    homeBtn.removeAttribute("data-tf-dragging");
    homeBtn.setAttribute("aria-grabbed", "false");
    if (!wasDragging && !cancelled) goHome();
  };

  homeBtn.setAttribute("aria-grabbed", "false");
  homeBtn.setAttribute("title", "All Apps • Drag to move • Shift + Escape");

  homeBtn.addEventListener("pointerdown", event => {
    if (activePointer !== null) return;
    if (event.pointerType === "mouse" && event.button !== 0) return;
    const rect = homeBtn.getBoundingClientRect();
    activePointer = event.pointerId;
    startX = event.clientX;
    startY = event.clientY;
    startLeft = rect.left;
    startTop = rect.top;
    dragging = false;
    try { homeBtn.setPointerCapture(event.pointerId); } catch {}
  });

  homeBtn.addEventListener("pointermove", event => {
    if (event.pointerId !== activePointer) return;
    const dx = event.clientX - startX;
    const dy = event.clientY - startY;
    if (!dragging && Math.hypot(dx, dy) >= DRAG_THRESHOLD) {
      dragging = true;
      homeBtn.setAttribute("data-tf-dragging", "true");
      homeBtn.setAttribute("aria-grabbed", "true");
    }
    if (!dragging) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    placeAt(startLeft + dx, startTop + dy);
  });

  homeBtn.addEventListener("pointerup", event => endDrag(event, false));
  homeBtn.addEventListener("pointercancel", event => endDrag(event, true));
  homeBtn.addEventListener("lostpointercapture", event => {
    if (activePointer !== null && event.pointerId === activePointer && dragging) {
      savePosition();
      activePointer = null;
      dragging = false;
      homeBtn.removeAttribute("data-tf-dragging");
      homeBtn.setAttribute("aria-grabbed", "false");
    }
  });

  // Keyboard-generated clicks should still work, while the synthetic click
  // after a drag is suppressed so moving the button never exits the module.
  homeBtn.addEventListener("click", event => {
    if (performance.now() < suppressClickUntil) {
      event.preventDefault();
      event.stopImmediatePropagation();
      return;
    }
    if (event.detail === 0) goHome();
  });

  document.addEventListener("keydown", event => {
    if (event.shiftKey && event.key === "Escape") {
      event.preventDefault();
      event.stopImmediatePropagation();
      goHome();
    }
  }, true);

  const refit = () => restorePosition();
  window.addEventListener("resize", refit, { passive: true });
  window.visualViewport?.addEventListener("resize", refit, { passive: true });
  window.visualViewport?.addEventListener("scroll", refit, { passive: true });
  window.addEventListener("orientationchange", () => setTimeout(refit, 80), { passive: true });
  restorePosition();
})();
</script>
