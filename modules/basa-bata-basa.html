<script>
(()=>{

  const RARE_NAMES=["Pearl Crown Dumpling","Rainbow Glitter Dumpling","Strawberry Milk Dumpling","Galaxy Glitter Dumpling","Jade Lucky Dumpling","Golden Butter Cube","Color-Shift Stress Cube","Rainbow Soft Stress Ball","Crystal Jelly Cube","Bubble-Gel Cube","Peach Mochi Bunny","Ocean Mochi Whale","Sleepy Cat Cream Bun","Frog Cream Bun","Panda Steamed Bun","Moonlight Dumpling","Holographic Dumpling","Royal Fortune Dumpling","Snowflake Dumpling","Golden Rainbow Dumpling","Aurora Pearl Dumpling","Cherry Blossom Dumpling","Lemon Star Dumpling","Ocean Pearl Dumpling","Emerald Firefly Dumpling","Strawberry Butter Slab","Cosmic Soft Cube","Sunset Swirl Ball","Diamond Ice Cube","Confetti Bubble Cube","Lavender Mochi Bunny","Mint Axolotl Mochi","Cinnamon Bear Bun","Honey Bee Bun","Red Panda Bun","Solar Eclipse Dumpling","Opal Winged Dumpling","Sapphire Royal Dumpling","Snow-Globe Dumpling","Platinum Crown Dumpling"];
  const KEY="basaBataBasaGeneralV3",OLD_KEY="basaBataBasaGeneralV2";
  const blankProgress=()=>({mastered:[],attempts:{},index:0});
  const fresh=()=>({selectedLang:null,progress:{fil:blankProgress(),en:blankProgress(),customFil:blankProgress(),customEn:blankProgress(),stars:0,streak:0,best:0},settings:{autoRead:false,autoReadUserSet:false,syllableRead:false,speed:.8,case:"lower",sounds:true,music:true,musicUserSet:false,musicVolume:.7,filVoice:"",enVoice:"",source:{fil:"builtIn",en:"builtIn"},customWords:{fil:"",en:""}}});
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||JSON.parse(localStorage.getItem(OLD_KEY))||fresh()}catch(e){return fresh()}}
  let state=load(),defaults=fresh();state.progress={...defaults.progress,...state.progress};for(const k of ["fil","en","customFil","customEn"])state.progress[k]={...blankProgress(),...state.progress[k]};state.settings={...defaults.settings,...state.settings,source:{...defaults.settings.source,...(state.settings?.source||{})},customWords:{...defaults.settings.customWords,...(state.settings?.customWords||{})}};if(state.settings.musicUserSet!==true)state.settings.music=true;if(state.settings.autoReadUserSet!==true)state.settings.autoRead=false;state.settings.musicVolume=Math.max(0,Math.min(1,Number.isFinite(Number(state.settings.musicVolume))?Number(state.settings.musicVolume):.7));
  let screen="home",mode="learn",index=0,syllableIndex=0,voices=[],audioCtx=null,musicTimer=null,gameTarget=0,gameChoice=0,gameOptions=[],celebrateAfter=null,speechSequenceId=0,retryPending=false;
  const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],langName=l=>l==="fil"?"FILIPINO":"ENGLISH";
  function parseCustom(text){const seen=new Set;return String(text||"").split(",").map(v=>v.trim()).filter(v=>{const k=v.toLocaleLowerCase();if(!k||seen.has(k))return false;seen.add(k);return true}).slice(0,200)}
  const FILIPINO_SYLLABLES={"mga":"mga","ng":"ng","oo":"o-o","iyon":"i-yon","siya":"si-ya","niya":"ni-ya","ninyo":"nin-yo","siyam":"si-yam","saan":"sa-an","paano":"pa-a-no","kailan":"ka-i-lan","ngayon":"nga-yon","paaralan":"pa-a-ra-lan","kaibigan":"ka-i-bi-gan","pagkain":"pag-ka-in","maikli":"ma-i-kli","mainit":"ma-i-nit","maasim":"ma-a-sim","maalat":"ma-a-lat","tainga":"ta-i-nga","bituin":"bi-tu-in","tatsulok":"tat-su-lok","bulaklak":"bu-lak-lak","paru-paro":"pa-ru-pa-ro"};

  function filipinoWordSyllables(raw){const w=String(raw||"").toLocaleLowerCase("fil").replace(/[^a-zñ-]/g,"");if(!w)return[];if(FILIPINO_SYLLABLES[w])return FILIPINO_SYLLABLES[w].split("-");if(w.includes("-"))return w.split("-").flatMap(filipinoWordSyllables);const vowels=[];for(let i=0;i<w.length;i++)if("aeiou".includes(w[i]))vowels.push(i);if(vowels.length<2)return[w];const onsets=["str","spr","skr","bl","br","dr","dy","gr","gw","kl","kr","kw","pl","pr","sw","sy","tr","ts","ng"],cuts=[0];for(let i=0;i<vowels.length-1;i++){const next=vowels[i+1],between=w.slice(vowels[i]+1,next);let onset="";for(const candidate of onsets)if(between.endsWith(candidate)&&candidate.length>onset.length)onset=candidate;if(!onset&&between)onset=between.slice(-1);cuts.push(next-onset.length)}cuts.push(w.length);return cuts.slice(0,-1).map((start,i)=>w.slice(start,cuts[i+1])).filter(Boolean)}
  function englishWordSyllables(raw){const w=String(raw||"").toLocaleLowerCase("en").replace(/[^a-z'-]/g,"");if(!w)return[];if(ENGLISH_SYLLABLES[w])return ENGLISH_SYLLABLES[w].split("-");if(w.includes("-"))return w.split("-").flatMap(englishWordSyllables);const groups=[...w.matchAll(/[aeiouy]+/g)].filter((m,i,a)=>!(m.index===w.length-1&&m[0]==="e"&&a.length>1));if(groups.length<2)return[w];const cuts=[0];for(let i=0;i<groups.length-1;i++){const end=groups[i].index+groups[i][0].length,next=groups[i+1].index,gap=next-end;cuts.push(gap<=1?end:end+Math.max(1,gap-1))}cuts.push(w.length);return cuts.slice(0,-1).map((start,i)=>w.slice(start,cuts[i+1])).filter(Boolean)}

  function isCustom(l){return state.settings.source[l]==="custom"&&parseCustom(state.settings.customWords[l]).length>0}

  function renderHome(){const t=totals();$('#homeWords').textContent=`${t.total} / 400`;$('#homeStars').textContent=state.progress.stars||0;$$('[data-lang]').forEach(b=>b.classList.toggle('selected',b.dataset.lang===state.selectedLang));$('#homeAutoDot').className=`control-dot ${state.settings.autoRead?'on':'off'}`;$('#homeMusicDot').className=`control-dot ${state.settings.music?'on':'off'}`;save()}

  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
  <span>ALL APPS</span>

<script id="teacher-francis-suite-bridge-script">
(() => {
  const homeBtn = document.getElementById("teacher-francis-suite-home");
  if (!homeBtn) return;

  const POSITION_KEY = "teacher-francis-suite-home-position-v1";
  const EDGE_GAP = 6;
  const DRAG_THRESHOLD = 6;
  let activePointer = null;
  let startX = 0, startY = 0, startLeft = 0, startTop = 0;
  let dragging = false;
  let suppressClickUntil = 0;

  const goHome = () => {
    try { speechSynthesis?.cancel?.(); } catch {}
    try {
      if (window.parent && window.parent !== window) {
        try { if (typeof window.parent.showHome === "function") { window.parent.showHome(); return; } } catch {}
        parent.postMessage({ type: "teacher-francis-suite-home" }, "*");
      } else {
        location.href = "../index.html";
      }
    } catch {
      location.href = "../index.html";
    }
  };

  const viewportBox = () => {
    const vv = window.visualViewport;
    const width = Math.max(1, vv?.width || document.documentElement.clientWidth || innerWidth || 1);
    const height = Math.max(1, vv?.height || document.documentElement.clientHeight || innerHeight || 1);
    const left = vv?.offsetLeft || 0;
    const top = vv?.offsetTop || 0;
    return { width, height, left, top };
  };

  const clamp = (value, min, max) => Math.min(Math.max(value, min), Math.max(min, max));

  const placeAt = (left, top) => {
    const vp = viewportBox();
    const rect = homeBtn.getBoundingClientRect();
    const minLeft = vp.left + EDGE_GAP;
    const minTop = vp.top + EDGE_GAP;
    const maxLeft = vp.left + vp.width - rect.width - EDGE_GAP;
    const maxTop = vp.top + vp.height - rect.height - EDGE_GAP;
    const x = clamp(left, minLeft, maxLeft);
    const y = clamp(top, minTop, maxTop);
    homeBtn.style.setProperty("left", `${x}px`, "important");
    homeBtn.style.setProperty("top", `${y}px`, "important");
    homeBtn.style.setProperty("right", "auto", "important");
    homeBtn.style.setProperty("bottom", "auto", "important");
    return { x, y, vp, rect: homeBtn.getBoundingClientRect() };
  };

  const savePosition = () => {
    try {
      const vp = viewportBox();
      const rect = homeBtn.getBoundingClientRect();
      const usableW = Math.max(1, vp.width - rect.width - EDGE_GAP * 2);
      const usableH = Math.max(1, vp.height - rect.height - EDGE_GAP * 2);
      const x = clamp((rect.left - vp.left - EDGE_GAP) / usableW, 0, 1);
      const y = clamp((rect.top - vp.top - EDGE_GAP) / usableH, 0, 1);
      localStorage.setItem(POSITION_KEY, JSON.stringify({ x, y }));
    } catch {}
  };

  const restorePosition = () => {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(POSITION_KEY) || "null"); } catch {}
    if (!saved || !Number.isFinite(saved.x) || !Number.isFinite(saved.y)) return;
    requestAnimationFrame(() => {
      const vp = viewportBox();
      const rect = homeBtn.getBoundingClientRect();
      const usableW = Math.max(0, vp.width - rect.width - EDGE_GAP * 2);
      const usableH = Math.max(0, vp.height - rect.height - EDGE_GAP * 2);
      placeAt(
        vp.left + EDGE_GAP + clamp(saved.x, 0, 1) * usableW,
        vp.top + EDGE_GAP + clamp(saved.y, 0, 1) * usableH
      );
    });
  };

  const endDrag = (event, cancelled = false) => {
    if (activePointer === null || event.pointerId !== activePointer) return;
    const wasDragging = dragging;
    if (wasDragging) {
      event.preventDefault();
      event.stopImmediatePropagation();
      savePosition();
      suppressClickUntil = performance.now() + 700;
    }
    try { homeBtn.releasePointerCapture(activePointer); } catch {}
    activePointer = null;
    dragging = false;
    homeBtn.removeAttribute("data-tf-dragging");
    homeBtn.setAttribute("aria-grabbed", "false");
    if (!wasDragging && !cancelled) goHome();
  };

  homeBtn.setAttribute("aria-grabbed", "false");
  homeBtn.setAttribute("title", "All Apps • Drag to move • Shift + Escape");

  homeBtn.addEventListener("pointerdown", event => {
    if (activePointer !== null) return;
    if (event.pointerType === "mouse" && event.button !== 0) return;
    const rect = homeBtn.getBoundingClientRect();
    activePointer = event.pointerId;
    startX = event.clientX;
    startY = event.clientY;
    startLeft = rect.left;
    startTop = rect.top;
    dragging = false;
    try { homeBtn.setPointerCapture(event.pointerId); } catch {}
  });

  homeBtn.addEventListener("pointermove", event => {
    if (event.pointerId !== activePointer) return;
    const dx = event.clientX - startX;
    const dy = event.clientY - startY;
    if (!dragging && Math.hypot(dx, dy) >= DRAG_THRESHOLD) {
      dragging = true;
      homeBtn.setAttribute("data-tf-dragging", "true");
      homeBtn.setAttribute("aria-grabbed", "true");
    }
    if (!dragging) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    placeAt(startLeft + dx, startTop + dy);
  });

  homeBtn.addEventListener("pointerup", event => endDrag(event, false));
  homeBtn.addEventListener("pointercancel", event => endDrag(event, true));
  homeBtn.addEventListener("lostpointercapture", event => {
    if (activePointer !== null && event.pointerId === activePointer && dragging) {
      savePosition();
      activePointer = null;
      dragging = false;
      homeBtn.removeAttribute("data-tf-dragging");
      homeBtn.setAttribute("aria-grabbed", "false");
    }
  });

  // Keyboard-generated clicks should still work, while the synthetic click
  // after a drag is suppressed so moving the button never exits the module.
  homeBtn.addEventListener("click", event => {
    if (performance.now() < suppressClickUntil) {
      event.preventDefault();
      event.stopImmediatePropagation();
      return;
    }
    if (event.detail === 0) goHome();
  });

  document.addEventListener("keydown", event => {
    if (event.shiftKey && event.key === "Escape") {
      event.preventDefault();
      event.stopImmediatePropagation();
      goHome();
    }
  }, true);

  const refit = () => restorePosition();
  window.addEventListener("resize", refit, { passive: true });
  window.visualViewport?.addEventListener("resize", refit, { passive: true });
  window.visualViewport?.addEventListener("scroll", refit, { passive: true });
  window.addEventListener("orientationchange", () => setTimeout(refit, 80), { passive: true });
  restorePosition();
})();
</script>


<script id="tf-unified-dialog-script">

  }
  function open(type,message,opts={}){
    const layer=ensure(),card=layer.querySelector('.tf-dialog-card'),title=layer.querySelector('.tf-dialog-title'),icon=layer.querySelector('.tf-dialog-icon'),msg=layer.querySelector('.tf-dialog-message'),input=layer.querySelector('.tf-dialog-input'),cancel=layer.querySelector('.tf-dialog-cancel'),confirm=layer.querySelector('.tf-dialog-confirm');
    if(activeResolve){const r=activeResolve;activeResolve=null;try{r(activeType==='prompt'?null:false)}catch{}}

    card.classList.toggle('danger',opts.tone==='danger');

    icon.textContent=opts.icon||(opts.tone==='danger'?'!':'✦');
